name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        run: hugo --minify

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            public/ $VPS_USER@$VPS_HOST:/var/www/vitorpy.com/
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Deploy nginx config if changed
        run: |
          if [ -f nginx.conf ]; then
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              $VPS_USER@$VPS_HOST \
              "mkdir -p /tmp/deploy"

            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              nginx.conf $VPS_USER@$VPS_HOST:/tmp/deploy/nginx.conf

            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              $VPS_USER@$VPS_HOST \
              "if ! diff -q /tmp/deploy/nginx.conf /etc/nginx/conf.d/vitorpy.conf > /dev/null 2>&1; then \
                sudo cp /tmp/deploy/nginx.conf /etc/nginx/conf.d/vitorpy.conf && \
                sudo nginx -t && \
                sudo systemctl reload nginx && \
                echo 'Nginx config updated and reloaded'; \
              else \
                echo 'Nginx config unchanged'; \
              fi"
          fi
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Cleanup
        run: rm -f ~/.ssh/deploy_key ~/.ssh/id_ed25519